<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q1 Informatik</title>
<style>
  :root { --acc:#1f6f78; --soft:#e6f1f2; --ink:#1d2327; --muted:#5b6770; --bg:#f4f6f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 "Segoe UI", Calibri, "Liberation Sans", sans-serif; }
  header { background:var(--acc); color:#fff; padding:22px 16px; }
  header h1 { margin:0 auto; max-width:820px; font-size:26px; }
  header p { margin:4px auto 0; max-width:820px; opacity:.9; }
  main { max-width:820px; margin:0 auto; padding:18px 16px 40px; }
  h2 { color:var(--acc); font-size:19px; margin:26px 0 10px; border-bottom:2px solid var(--soft); padding-bottom:4px; }
  a.uebung { display:block; background:#fff; border-left:6px solid var(--acc); border-radius:8px; padding:12px 16px; margin:10px 0;
             color:var(--ink); text-decoration:none; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  a.uebung:hover { background:var(--soft); }
  a.uebung b { color:var(--acc); font-size:17px; }
  a.uebung span { display:block; color:var(--muted); font-size:14px; margin-top:2px; }
</style>
</head>
<body>
<header>
  <h1>Q1 Informatik</h1>
  <p>Übungen und Materialien zum Unterricht</p>
</header>
<main>

  <h2>Textadventure: Klassen und Objekte</h2>

  <a class="uebung" href="klasse_objekt_sicherung.html">
    <b>Klasse und Objekt: Sicherung (Schulmensa)</b>
    <span>Stunde 3 · Karten richtig zuordnen · Abgabe als Datei</span>
  </a>

  <!--
    NEUE ÜBUNG ERGÄNZEN:
    1. Die HTML-Datei der Übung in diesen Ordner (Q1_Info) legen.
    2. Den folgenden Block kopieren, oberhalb dieses Kommentars einfügen und anpassen:
       href = Dateiname, <b> = Titel, <span> = kurze Beschreibung.

  <a class="uebung" href="dateiname.html">
    <b>Titel der Übung</b>
    <span>Stunde … · kurze Beschreibung</span>
  </a>

    NEUES THEMA: eine neue Überschrift einfügen, z. B.
  <h2>Suchen und Sortieren</h2>
  -->

</main>
</body>
</html>
