<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sortierverfahren beobachten</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f7f9fb; --bd:#d9dee6;
  --tx:#16202b; --mut:#67727f; --acc:#2563eb;
  --cmp:#f59e0b; --swp:#ef4444; --don:#22c55e; --min:#8b5cf6; --key:#0ea5e9; --mov:#14b8a6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12161c; --panel:#1a2029; --panel2:#141a22; --bd:#2c3644;
         --tx:#e6ebf2; --mut:#94a3b3; --acc:#60a5fa; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 30px}
h1{font-size:21px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{font-size:13.5px;color:var(--mut);margin-top:2px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:4px}
.tab{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:15px;
  padding:8px 16px;border-radius:7px;cursor:pointer}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--acc);color:#fff}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
button.b{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--bd);background:var(--panel);
  color:var(--tx);border-radius:8px;padding:9px 15px;cursor:pointer}
button.b:hover{border-color:var(--acc);color:var(--acc)}
button.b:disabled{opacity:.4;cursor:default;border-color:var(--bd);color:var(--mut)}
button.b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.b.pri:hover{filter:brightness(1.08);color:#fff}
input[type=text]{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;
  background:var(--panel);color:var(--tx);width:220px}
.spacer{flex:1}
.grp{display:inline-flex;gap:8px;align-items:center}
.speed{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
input[type=range]{accent-color:var(--acc);width:120px}
input[type=number]{font:inherit;font-size:15px;width:62px;padding:7px 6px;border:1px solid var(--bd);
  border-radius:7px;background:var(--panel);color:var(--tx)}

.vis{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:360px;padding:8px 4px 0}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:96px;height:100%}
.val{font-size:19px;font-weight:700;margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar{width:100%;border-radius:9px 9px 4px 4px;background:#9aa7b8;
  transition:height .2s ease,background .2s ease;border:3px solid transparent}
@media (prefers-color-scheme: dark){ .bar{background:#48566a} }
.idx{font-size:13px;color:var(--mut);margin-top:7px;font-variant-numeric:tabular-nums}
.col.done .bar{background:var(--don)}
.col.region .bar{background:#8fd7a8}
@media (prefers-color-scheme: dark){ .col.region .bar{background:#2f6b45} }
.col.cmp .bar{background:var(--cmp);border-color:var(--cmp)}
.col.swp .bar{background:var(--swp);border-color:var(--swp)}
.col.min .bar{background:var(--min)}
.col.key .bar{background:var(--key)}
.col.mov .bar{background:var(--mov)}
.col.hole .bar{opacity:.3;border:3px dashed var(--mut);background:transparent}
.col.act .idx{color:var(--tx);font-weight:700}

.op{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--bd)}
.badge{font-size:13.5px;font-weight:700;padding:5px 13px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.badge.cmp{background:var(--cmp);border-color:var(--cmp);color:#3a2600}
.badge.swp{background:var(--swp);border-color:var(--swp);color:#fff}
.badge.mov{background:var(--mov);border-color:var(--mov);color:#04302c}
.badge.don{background:var(--don);border-color:var(--don);color:#062d15}
.badge.key{background:var(--key);border-color:var(--key);color:#012738}
.optxt{font-size:17px;font-weight:500}
.count{margin-left:auto;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.hide{display:none!important}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--mut);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.optionen{display:flex;gap:18px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--mut)}
.optionen label{display:flex;gap:6px;align-items:center;cursor:pointer}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}

.auftrag{margin-top:16px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.auftrag h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px;font-weight:700}
.auftrag ol{margin:0;padding-left:22px}
.auftrag li{margin-bottom:7px;font-size:15.5px}
.auftrag li:last-child{margin-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="display:inline-block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--acc);text-decoration:none">&larr; &Uuml;bersicht</a>

  <div class="topbar">
    <div>
      <h1>Sortierverfahren beobachten</h1>
      <div class="sub">Nur der Ablauf – ohne Pseudocode und ohne Programmcode</div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-algo="bubble">Bubble Sort</button>
      <button class="tab" data-algo="insertion">Insertion Sort</button>
      <button class="tab" data-algo="selection">Selection Sort</button>
    </div>
  </div>

  <div class="panel">
    <div class="ctrl">
      <button class="b pri" id="play">&#9654; Abspielen</button>
      <button class="b" id="prev">&#9198; Zurück</button>
      <button class="b" id="next">&#9197; Schritt</button>
      <button class="b" id="reset">&#8635; Zurücksetzen</button>
      <span class="speed">Tempo <input type="range" id="speed" min="1" max="10" value="5"></span>
      <span class="speed">Anzahl n <input type="number" id="anz" min="1" max="8" value="8"></span>
      <span class="spacer"></span>
      <span class="grp"><input type="text" id="inp" placeholder="1 bis 8 Zahlen, z. B. 34 7 91 12">
      <button class="b" id="use">Übernehmen</button></span>
      <button class="b" id="rnd">Neue Zahlen</button>
      <button class="b" id="best" title="Best Case">&#8593; sortiert</button>
      <button class="b" id="worst" title="Worst Case">&#8595; umgekehrt</button>
    </div>

    <div class="vis" id="vis"></div>

    <div class="op">
      <span class="badge" id="badge">Start</span>
      <span class="optxt" id="optxt">&mdash;</span>
      <span class="count" id="stats"></span>
      <span class="count" id="count" style="margin-left:0">Schritt 0 / 0</span>
    </div>

    <div class="legend" id="legend"></div>

    <div class="optionen">
      <label><input type="checkbox" id="cbText" checked> Beschreibung anzeigen</label>
      <label><input type="checkbox" id="cbZahl" checked> Zähler anzeigen</label>
      <span>Tastatur: Leertaste = Start/Pause, &#8592; und &#8594; = einzelne Schritte</span>
    </div>
  </div>

  <div class="auftrag">
    <h2>Beobachtungsauftrag</h2>
    <ol id="fragen"></ol>
  </div>

</div>

<script>
"use strict";

function rng(from, to){ const r=[]; for(let x=from;x<=to;x++) r.push(x); return r; }

function genBubble(input){
  const a=input.slice(), n=a.length, steps=[]; let sorted=[], cV=0, cT=0;
  const S=(line,vars,hi,op,text)=>{
    if(op==="cmp") cV++;
    if(op==="swp"||op==="mov") cT++;
    steps.push({arr:a.slice(),line,vars:Object.assign({},vars),hi:hi||{},op,text,
                sorted:sorted.slice(),cnt:{v:cV,t:cT}});
  };
  const B = g => (g ? "wahr" : "falsch");
  S(0,{n:n},{},"start","Startfolge einlesen, n = "+n);
  for(let i=0;i<n-1;i++){
    S(1,{n:n,i:i},{},"loop","Äußerer Durchlauf i = "+i);
    let g=false;
    S(2,{n:n,i:i,getauscht:B(g)},{},"set","getauscht = falsch (Merker für diesen Durchlauf)");
    for(let j=0;j<n-1-i;j++){
      S(3,{n:n,i:i,j:j,getauscht:B(g)},{},"loop","Innere Schleife j = "+j);
      S(4,{n:n,i:i,j:j,getauscht:B(g)},{cmp:[j,j+1]},"cmp",
        "Vergleiche a["+j+"] = "+a[j]+" mit a["+(j+1)+"] = "+a[j+1]);
      if(a[j]>a[j+1]){
        const x=a[j], y=a[j+1];
        a[j]=y; a[j+1]=x;
        S(5,{n:n,i:i,j:j,getauscht:B(g)},{swp:[j,j+1]},"swp",
          "Tausch: "+x+" > "+y+" → a["+j+"] und a["+(j+1)+"] vertauschen");
        g=true;
        S(6,{n:n,i:i,j:j,getauscht:B(g)},{},"set","getauscht = wahr – dieser Durchlauf war nicht umsonst");
      }else{
        S(4,{n:n,i:i,j:j,getauscht:B(g)},{cmp:[j,j+1]},"nop","Kein Tausch: a["+j+"] ≤ a["+(j+1)+"]");
      }
    }
    sorted = rng(n-1-i, n-1);
    S(7,{n:n,i:i,getauscht:B(g)},{},g?"loop":"done","Durchlauf zu Ende: getauscht = "+B(g)
      + (g ? " → weiter, Position "+(n-1-i)+" steht endgültig fest" : " → kein einziger Tausch"));
    if(!g){
      sorted = rng(0,n-1);
      S(8,{n:n,i:i,getauscht:B(g)},{},"done",
        "Abbruch: Ohne Tausch ist das Feld bereits sortiert – alle weiteren Durchläufe entfallen");
      break;
    }
  }
  sorted = rng(0,n-1);
  S(9,{n:n},{},"done","Fertig – das Feld ist sortiert");
  return steps;
}

function genInsertion(input){
  const a=input.slice(), n=a.length, steps=[]; let sorted=[], cV=0, cT=0;
  const S=(line,vars,hi,op,text)=>{
    if(op==="cmp") cV++;
    if(op==="swp"||op==="mov") cT++;
    steps.push({arr:a.slice(),line,vars:Object.assign({},vars),hi:hi||{},op,text,
                sorted:sorted.slice(),cnt:{v:cV,t:cT}});
  };
  S(0,{n:n},{},"start","Startfolge einlesen, n = "+n);
  for(let i=1;i<n;i++){
    sorted = rng(0,i-1);
    S(1,{n:n,i:i},{},"loop","Durchlauf i = "+i+" (links steht ein sortierter Bereich)");
    const key=a[i];
    S(2,{n:n,i:i,schluessel:key},{key:[i]},"key","schluessel = a["+i+"] = "+key);
    let j=i-1;
    S(3,{n:n,i:i,schluessel:key,j:j},{key:[i]},"set","j = "+j);
    while(true){
      if(j>=0){
        S(4,{n:n,i:i,schluessel:key,j:j},{cmp:[j],key:[i]},"cmp",
          "Ist a["+j+"] = "+a[j]+" größer als schluessel = "+key+"?");
        if(!(a[j]>key)) break;
      }else{
        S(4,{n:n,i:i,schluessel:key,j:j},{},"nop","j = "+j+" → linker Rand erreicht, Schleife endet");
        break;
      }
      a[j+1]=a[j];
      S(5,{n:n,i:i,schluessel:key,j:j},{mov:[j+1],hole:[j]},"mov",
        "Verschieben: a["+(j+1)+"] = a["+j+"] = "+a[j+1]);
      j=j-1;
      S(6,{n:n,i:i,schluessel:key,j:j},{},"set","j = "+j);
    }
    a[j+1]=key;
    S(7,{n:n,i:i,schluessel:key,j:j},{key:[j+1]},"key","Einfügen: a["+(j+1)+"] = schluessel = "+key);
    sorted = rng(0,i);
  }
  sorted = rng(0,n-1);
  S(8,{n:n},{},"done","Fertig – das Feld ist sortiert");
  return steps;
}

function genSelection(input){
  const a=input.slice(), n=a.length, steps=[]; let sorted=[], cV=0, cT=0;
  const S=(line,vars,hi,op,text)=>{
    if(op==="cmp") cV++;
    if(op==="swp"||op==="mov") cT++;
    steps.push({arr:a.slice(),line,vars:Object.assign({},vars),hi:hi||{},op,text,
                sorted:sorted.slice(),cnt:{v:cV,t:cT}});
  };
  S(0,{n:n},{},"start","Startfolge einlesen, n = "+n);
  for(let i=0;i<n-1;i++){
    S(1,{n:n,i:i},{},"loop","Durchlauf i = "+i);
    let m=i;
    S(2,{n:n,i:i,min_i:m},{min:[m]},"set","min_i = "+m+" (erster unsortierter Platz)");
    for(let j=i+1;j<n;j++){
      S(3,{n:n,i:i,j:j,min_i:m},{min:[m]},"loop","Innere Schleife j = "+j);
      S(4,{n:n,i:i,j:j,min_i:m},{cmp:[j],min:[m]},"cmp",
        "Vergleiche a["+j+"] = "+a[j]+" mit a["+m+"] = "+a[m]);
      if(a[j]<a[m]){
        m=j;
        S(5,{n:n,i:i,j:j,min_i:m},{min:[m]},"set","Neues Minimum gefunden: min_i = "+m);
      }
    }
    if(m!==i){
      const x=a[i], y=a[m];
      a[i]=y; a[m]=x;
      S(6,{n:n,i:i,min_i:m},{swp:[i,m]},"swp","Tausch: a["+i+"] ("+x+") ↔ a["+m+"] ("+y+")");
    }else{
      S(6,{n:n,i:i,min_i:m},{},"nop","min_i = i → kein Tausch nötig");
    }
    sorted = rng(0,i);
  }
  sorted = rng(0,n-1);
  S(7,{n:n},{},"done","Fertig – das Feld ist sortiert");
  return steps;
}

const GEN = { bubble:genBubble, insertion:genInsertion, selection:genSelection };

/* ---------- Beobachtungsaufträge ---------- */
const FRAGEN = {
  bubble: [
    "Sieh dir einen vollständigen Durchlauf an. Wo steht danach das größte Element? Begründe, warum das immer so sein muss.",
    "Vergleiche den zweiten Durchlauf mit dem ersten: Wie weit nach rechts wird noch verglichen? Warum reicht das aus?",
    "Woran könnte das Verfahren erkennen, dass es aufhören darf, bevor alle Durchläufe erledigt sind? Prüfe deine Vermutung mit „↑ sortiert“."
  ],
  insertion: [
    "Welcher Teil der Reihe ist links vom aktuellen Element immer schon sortiert? Ist er auch endgültig sortiert?",
    "Beobachte, was mit den Werten geschieht, die größer sind als der herausgenommene Wert. Beschreibe die Bewegung in einem Satz.",
    "Bei welcher Ausgangsreihenfolge muss am wenigsten verschoben werden, bei welcher am meisten? Prüfe mit „↑ sortiert“ und „↓ umgekehrt“."
  ],
  selection: [
    "Was passiert alles, bevor zum ersten Mal getauscht wird? Beschreibe, wonach in dieser Zeit gesucht wird.",
    "Wie oft wird pro Durchlauf höchstens getauscht? Vergleiche das mit Bubble Sort auf derselben Zahlenreihe.",
    "Arbeitet das Verfahren weniger, wenn die Reihe schon sortiert ist? Prüfe mit „↑ sortiert“ und erkläre deine Beobachtung."
  ]
};

const LEGENDEN = {
  bubble: [["cmp", "verglichen"], ["swp", "vertauscht"], ["don", "endgültig sortiert"]],
  insertion: [["cmp", "verglichen"], ["key", "herausgenommener Wert"], ["mov", "wird verschoben"],
              ["don", "sortierter Bereich"]],
  selection: [["cmp", "verglichen"], ["min", "bisher kleinster Wert"], ["swp", "vertauscht"],
              ["don", "endgültig sortiert"]]
};

/* ---------- Zustand ---------- */
let algo = "bubble", data = [], steps = [], pos = 0, timer = null, playing = false;
const $ = id => document.getElementById(id);

function anzahl(){ return Math.max(1, Math.min(8, parseInt($("anz").value, 10) || 8)); }

function randomData(n){
  const s = new Set();
  while(s.size < n) s.add(5 + Math.floor(Math.random() * 95));
  return Array.from(s);
}

function build(keepData){
  if(!keepData) data = randomData(anzahl());
  steps = GEN[algo](data);
  pos = 0;
  $("inp").value = data.join(" ");
  $("anz").value = data.length;
  $("fragen").innerHTML = FRAGEN[algo].map(f => "<li>" + f + "</li>").join("");
  $("legend").innerHTML = LEGENDEN[algo].map(l =>
    '<span><i style="background:var(--' + l[0] + ')"></i>' + l[1] + "</span>").join("");
  render();
}

/* ---------- Anzeige ---------- */
const BADGE = {start:"", loop:"", set:"", nop:"", cmp:"cmp", swp:"swp", mov:"mov", key:"key", done:"don"};
const LABEL = {start:"Start", loop:"weiter", set:"merken", nop:"kein Tausch",
               cmp:"Vergleich", swp:"Tausch", mov:"Verschieben", key:"Schlüssel", done:"Fertig"};

function render(){
  const st = steps[pos];
  const arr = st.arr, mx = Math.max.apply(null, arr);

  const vis = $("vis"); vis.innerHTML = "";
  const h = i => Math.round(40 + (arr[i] / mx) * 250);
  const inArr = (k, name) => (st.hi[name] || []).indexOf(k) >= 0;
  for(let k = 0; k < arr.length; k++){
    const c = document.createElement("div"); c.className = "col";
    c.style.width = (arr.length <= 3 ? 150 : arr.length <= 5 ? 120 : 96) + "px";
    if(st.sorted.indexOf(k) >= 0)
      c.classList.add(algo === "insertion" && st.sorted.length < arr.length ? "region" : "done");
    if(inArr(k, "min")) c.classList.add("min");
    if(inArr(k, "mov")) c.classList.add("mov");
    if(inArr(k, "key")) c.classList.add("key");
    if(inArr(k, "cmp")) c.classList.add("cmp", "act");
    if(inArr(k, "swp")) c.classList.add("swp", "act");
    if(inArr(k, "hole")) c.classList.add("hole");
    c.innerHTML = '<div class="val">' + arr[k] + '</div><div class="bar" style="height:' + h(k) + 'px"></div>'
                + '<div class="idx">' + k + "</div>";
    vis.appendChild(c);
  }

  const b = $("badge");
  b.className = "badge" + (BADGE[st.op] ? " " + BADGE[st.op] : "");
  b.textContent = LABEL[st.op];
  $("optxt").textContent = st.text;
  $("stats").textContent = "Vergleiche: " + st.cnt.v + " · "
     + (algo === "insertion" ? "Verschiebungen: " : "Tausche: ") + st.cnt.t + "  |";
  $("count").textContent = "n = " + arr.length + "  ·  Schritt " + pos + " / " + (steps.length - 1);

  $("prev").disabled = pos === 0;
  $("next").disabled = pos >= steps.length - 1;
  if(pos >= steps.length - 1) stop();
}

/* ---------- Steuerung ---------- */
function delay(){ return 1150 - $("speed").value * 100; }
function stop(){ playing = false; clearTimeout(timer); $("play").innerHTML = "&#9654; Abspielen"; }
function tick(){
  if(!playing) return;
  if(pos >= steps.length - 1){ stop(); return; }
  pos++; render();
  if(playing) timer = setTimeout(tick, delay());
}
$("play").onclick = () => {
  if(playing){ stop(); return; }
  if(pos >= steps.length - 1) pos = 0;
  playing = true; $("play").innerHTML = "&#10073;&#10073; Pause"; render(); timer = setTimeout(tick, delay());
};
$("next").onclick = () => { stop(); if(pos < steps.length - 1){ pos++; render(); } };
$("prev").onclick = () => { stop(); if(pos > 0){ pos--; render(); } };
$("reset").onclick = () => { stop(); pos = 0; render(); };
$("rnd").onclick = () => { stop(); build(false); };
$("anz").onchange = () => { stop(); $("anz").value = anzahl(); build(false); };
$("best").onclick = () => { stop(); data = data.slice().sort((x, y) => x - y); build(true); };
$("worst").onclick = () => { stop(); data = data.slice().sort((x, y) => y - x); build(true); };
$("use").onclick = () => {
  const nums = $("inp").value.split(/[^0-9]+/).filter(s => s !== "").map(Number).slice(0, 8);
  if(nums.length < 1){ alert("Bitte 1 bis 8 Zahlen eingeben."); return; }
  stop(); data = nums; build(true);
};
$("inp").addEventListener("keydown", e => { if(e.key === "Enter") $("use").click(); });
$("tabs").onclick = e => {
  const t = e.target.closest(".tab"); if(!t) return;
  stop();
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  algo = t.dataset.algo;
  build(true);
};
$("cbText").onchange = e => {
  $("badge").classList.toggle("hide", !e.target.checked);
  $("optxt").classList.toggle("hide", !e.target.checked);
};
$("cbZahl").onchange = e => { $("stats").classList.toggle("hide", !e.target.checked); };
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.code === "Space"){ e.preventDefault(); $("play").click(); }
  if(e.key === "ArrowRight"){ e.preventDefault(); $("next").click(); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); $("prev").click(); }
});

build(false);
</script>
</body>
</html>
